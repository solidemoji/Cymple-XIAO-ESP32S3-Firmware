; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-cam]
platform = espressif32
framework = arduino
board = esp32cam
; build_flags = -DBOARD_HAS_PSRAM -mfix-esp32-psram-cache-issue

; ============================================================
; Seeed Studio XIAO ESP32-S3 Sense (onboard camera daughterboard)
; Camera pinout: src/camCfg.h (auto-selected by ARDUINO_XIAO_ESP32S3)
; Flash:  pio run -e xiao-esp32s3 -t upload
; ============================================================
[env:xiao-esp32s3]
platform = espressif32
framework = arduino
board = seeed_xiao_esp32s3
; NOTE: AsyncUDP / WiFi / EEPROM come built-in with the Arduino core,
;       so no lib_deps is required here. Do NOT add
;       me-no-dev/ESPAsyncUDP (ESP8266-only legacy lib, won't build).

; ============================================================
; XIAO ESP32-S3 Sense - WIRED variant (USB serial image out)
; Same as above but firmware streams frames over USB (Serial),
; no WiFi needed. Flash: pio run -e xiao-esp32s3-wire -t upload
; ============================================================
[env:xiao-esp32s3-wire]
platform = espressif32
framework = arduino
board = seeed_xiao_esp32s3
build_flags = -DCYMPLE_TRANSMIT_WIRE
; Upload stability: skip esptool stub and keep 115200 baud
; (high-speed stub at 460800 loses sync on this board's USB CDC)
upload_speed = 115200
upload_flags = --no-stub
